# Workflow do GitHub Actions — versão corrigida
#
# Mudanças em relação à versão anterior:
#   1. GEMINI_MODEL agora é passado ao script (antes o Actions caía no
#      padrão gemini-1.5-flash do código, que retorna 404).
#   2. A pasta .cache é restaurada/salva entre execuções via actions/cache,
#      fazendo a deduplicação de 72h funcionar também na nuvem.
#   3. cache: pip acelera a instalação das bibliotecas.

name: Resumo diário de notícias

on:
  schedule:
    - cron: "17 11 * * *"   # 08h17 em Brasília
    - cron: "5 13 * * *"    # 10h05 em Brasília
    - cron: "21 17 * * *"   # 14h21 em Brasília
    - cron: "45 18 * * *"   # 15h45 em Brasília
    - cron: "31 19 * * *"   # 16h31 em Brasília
  workflow_dispatch:

jobs:
  enviar-resumo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Restaura o cache de deduplicação da execução anterior.
      # A chave é única por execução (run_id) porque o GitHub não permite
      # sobrescrever um cache existente; o restore-keys "dedup-" recupera
      # sempre o mais recente disponível.
      - name: Restaurar o cache de deduplicação
        uses: actions/cache@v4
        with:
          path: .cache
          key: dedup-${{ github.run_id }}
          restore-keys: |
            dedup-

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Use aqui o mesmo modelo que funciona no seu .env local
          GEMINI_MODEL: gemini-3.6-flash
          PERFIL_ATIVO: condominios
        run: python automacao_sindico.py
